name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  gates:
    name: Validation gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown && rustup default stable
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
      - name: Document
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features
      - name: Check for git dependencies
        run: |
          ! grep -q 'source = "git+' Cargo.lock
      - name: Check wasm targets
        run: RUSTFLAGS="-D warnings" cargo check --target wasm32-unknown-unknown -p smudge-core -p smudge-cpu -p smudge-platform -p smudge-text -p smudge-widgets -p smudge
      - name: Install a system font for the consumer check
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - name: Check feature consumers
        run: tests/consumers/check.sh

  static-cargo-smudge:
    name: Static cargo-smudge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --target "$TARGET" && rustup default stable
      # mimalloc, the allocator of the musl build, compiles C for the target.
      - name: Install the musl C compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build
        run: cargo build --release --locked -p cargo-smudge --target "$TARGET"
      - name: Check the binary is static and runs
        run: |
          bin="target/$TARGET/release/cargo-smudge"
          file "$bin" | grep -q 'static-pie linked'
          if "$bin" smudge > usage.txt 2>&1; then exit 1; fi
          grep -q '^usage: cargo smudge new' usage.txt
