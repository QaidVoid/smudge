[package]
name = "smudge-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
pulldown-cmark = { version = "0.13.6", default-features = false }
smudge-core = { path = "../crates/smudge-core" }

[dependencies.smudge-text]
path = "../crates/smudge-text"

[[bin]]
name = "text_input_edits"
path = "fuzz_targets/text_input_edits.rs"
test = false
doc = false
bench = false

[[bin]]
name = "markdown_stream"
path = "fuzz_targets/markdown_stream.rs"
test = false
doc = false
bench = false
