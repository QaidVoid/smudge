[package]
name = "cargo-smudge"
description = "The cargo subcommand that makes, builds, runs and hot-patches Smudge apps"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
# The fixture app of the tests is its own package and never ships.
exclude = ["tests/fixtures"]

[dependencies]
gimli = { version = "0.32", default-features = false, features = ["read-all"] }
libc = "0.2"
object = { version = "0.37", default-features = false, features = ["read_core", "archive", "elf", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
