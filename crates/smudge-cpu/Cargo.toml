[package]
name = "smudge-cpu"
description = "CPU renderer for the Smudge GUI library that repaints only damaged regions"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[dependencies]
bytemuck = { version = "1.25.2", default-features = false }
skrifa = "0.44.0"
smudge-core = { version = "0.2.0", path = "../smudge-core" }
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "png-format"] }

[lints]
workspace = true

[dev-dependencies]
insta = "1.49.0"
smudge-text = { path = "../smudge-text" }
