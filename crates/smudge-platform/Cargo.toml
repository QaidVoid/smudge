[package]
name = "smudge-platform"
description = "Windowing, input and presentation for the Smudge GUI library"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[dependencies]
futures-executor = { version = "0.3.34", optional = true }
smudge-core = { version = "0.2.0", path = "../smudge-core" }
smudge-cpu = { version = "0.2.0", path = "../smudge-cpu" }
smudge-gpu = { version = "0.2.0", path = "../smudge-gpu", optional = true }
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
web-time = "1.1.0"
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }

[lints]
workspace = true

[dev-dependencies]
smudge-text = { path = "../smudge-text" }
smudge-widgets = { path = "../smudge-widgets" }

[features]
default = ["a11y"]
# The GPU renderer and its wgpu presentation path. futures-executor blocks on
# wgpu's adapter and device requests, which are immediately ready on native.
gpu = ["dep:smudge-gpu", "dep:futures-executor"]
# The accessibility projection, fed to AccessKit's winit adapter. The
# dependencies live in the non-wasm target table, so this feature is a no-op
# on wasm, which has no accessibility backend.
a11y = ["dep:smudge-a11y", "dep:accesskit", "dep:accesskit_winit"]
# Hot reload for apps started with `run_view`: a receiver applies the patches
# a patch builder sends, and the window remounts its root through the patched
# view. The dependency lives in the Linux target table, so this feature is a
# no-op everywhere else. Never on by default: with it off, no patching code
# is compiled in.
hot-reload = ["dep:subsecond", "smudge-core/hot-reload"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
accesskit = { version = "0.25.2", default-features = false, optional = true }
accesskit_winit = { version = "0.34.2", default-features = false, features = ["accesskit_unix", "async-io", "rwh_06"], optional = true }
arboard = { version = "3.7.0", default-features = false }
smudge-a11y = { version = "0.2.0", path = "../smudge-a11y", optional = true }

[target.wasm32-unknown-unknown.dev-dependencies]
wasm-bindgen = "0.2.129"

[target.'cfg(all(unix, not(any(target_os = "redox", target_family = "wasm", target_os = "android", target_os = "ios", target_os = "macos"))))'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["event"] }
wayland-client = { version = "0.31.15", default-features = false }
wayland-protocols = { version = "0.32.13", default-features = false, features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", default-features = false, features = ["client"] }

[target.'cfg(target_os = "linux")'.dependencies]
subsecond = { version = "=0.7.10", default-features = false, optional = true }

[package.metadata.docs.rs]
all-features = true
