[package]
name = "smudge-widgets"
description = "Containers, controls, menus, lists and the canvas for the Smudge GUI library"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[dependencies]
smudge-core = { version = "0.4.0", path = "../smudge-core" }
smudge-text = { version = "0.4.0", path = "../smudge-text", default-features = false }
web-time = "1.1.0"

[lints]
workspace = true

[features]
default = ["bundled-fonts"]
# Embeds the fonts in the text crate's assets, so widgets that lay out text
# find a font even when no other dependency provides one. An application
# that turns it off must enable another font source, such as `app-fonts`
# here or a font feature on the text crate.
bundled-fonts = ["smudge-text/bundled-fonts"]
# Counts the fonts the app registers itself as its font source, as the
# feature of the same name in the text crate describes.
app-fonts = ["smudge-text/app-fonts"]
# Hot reload, as the feature of the same name in the core crate describes.
# Turned on by the facade's feature of the same name.
hot-reload = ["smudge-core/hot-reload"]

[dev-dependencies]
insta = "1.49.0"
proptest = "1.12.0"
smudge-test = { path = "../smudge-test" }
