[package]
name = "smudge-widgets"
description = "The core widget set, containers and button, for the Smudge GUI library"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[dependencies]
smudge-core = { version = "0.2.0", path = "../smudge-core" }
smudge-text = { version = "0.2.0", path = "../smudge-text", default-features = false }

[lints]
workspace = true

[features]
default = ["bundled-fonts"]
# Embeds the fonts in the text crate's assets, so widgets that lay out text
# find a font even when no other dependency provides one. An application
# that turns it off must enable a font feature on the text crate itself.
bundled-fonts = ["smudge-text/bundled-fonts"]

[dev-dependencies]
insta = "1.49.0"
proptest = "1.12.0"
smudge-test = { path = "../smudge-test" }
