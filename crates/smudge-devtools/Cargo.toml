[package]
name = "smudge-devtools"
description = "Devtools drawn over a running app for the Smudge GUI library"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
smudge-core = { version = "0.5.0", path = "../smudge-core", features = ["devtools"] }
smudge-text = { version = "0.5.0", path = "../smudge-text", default-features = false }
smudge-widgets = { version = "0.5.0", path = "../smudge-widgets", default-features = false }

[dev-dependencies]
smudge-test = { path = "../smudge-test" }

[features]
default = ["bundled-fonts"]
# Embeds the fonts in the text crate's assets, as the feature of the same
# name in the widgets crate does, so the crate builds on its own. Crates that
# depend on it take it without its defaults, so the app's font choice is the
# one that applies.
bundled-fonts = ["smudge-text/bundled-fonts", "smudge-widgets/bundled-fonts"]
# Counts the fonts the app registers itself as its font source, as the
# feature of the same name in the text crate describes.
app-fonts = ["smudge-text/app-fonts", "smudge-widgets/app-fonts"]
