[package]
name = "smudge-core"
description = "Widget tree, reactive bindings, layout, paint and damage tracking for the Smudge GUI library"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[dependencies]
slotmap = "1.1.1"
taffy = { version = "0.15.0", default-features = false, features = ["std", "flexbox", "block_layout", "taffy_tree"] }
web-time = "1.1.0"

[lints]
workspace = true

[dev-dependencies]
criterion = "0.8.2"
insta = "1.49.0"
proptest = "1.12.0"
smudge-test = { path = "../smudge-test" }

[[bench]]
name = "reactive"
harness = false

[target.'cfg(target_os = "linux")'.dependencies]
subsecond = { version = "=0.7.10", default-features = false, optional = true }

[features]
# Hot reload for the closures the tree stores and for the app's own threads.
# Turned on by the same feature of the platform crate, which installs the
# jump table the lookups here read. Linux only, like the receiver.
hot-reload = ["dep:subsecond"]
