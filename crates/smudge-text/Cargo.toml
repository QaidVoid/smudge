[package]
name = "smudge-text"
description = "Font loading and parley-backed text layout for the Smudge GUI library"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[features]
default = ["bundled-fonts"]
# Embeds the fonts in `assets/fonts` so that layout never depends on the host.
bundled-fonts = []
# Discovers system fonts in addition to the bundled ones. Not available on
# wasm, which has no system fonts. Fontconfig is loaded at runtime through
# dlopen, so building needs no fontconfig development files.
system-fonts = ["parley/system", "fontique/fontconfig-dlopen"]
# Compiles in the word and line break dictionaries for Chinese, Japanese,
# Thai, Lao, Khmer and Burmese, so text in scripts without spaces between
# words wraps and selects by word. It adds about 3 MB to every binary and
# about 5 percent to the layout of other text, so it is off by default.
complex-scripts = ["parley/complex-scripts"]

[dependencies]
fontique = { version = "0.12.0", default-features = false }
parley = { version = "0.12.0", default-features = false, features = ["std"] }
skrifa = "0.44.0"
smudge-core = { version = "0.1.0", path = "../smudge-core" }
web-time = "1.1.0"

[lints]
workspace = true

[dev-dependencies]
insta = "1.49.0"
proptest = "1.12.0"
smudge-test = { path = "../smudge-test" }
