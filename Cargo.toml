[workspace]
resolver = "3"
members = [
  "crates/smudge-bench",
  "crates/smudge-core",
  "crates/smudge-cpu",
  "crates/smudge-platform",
  "crates/smudge-test",
  "crates/smudge-text",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/QaidVoid/smudge"
version = "0.1.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"
print_stdout = "warn"
